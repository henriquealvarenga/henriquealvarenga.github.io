format:
  html:
    theme: [cosmo, custom.scss]
    canonical-url: true
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    grid:
      body-width: 900px
      sidebar-width: 250px
      margin-width: 250px
    include-in-header:
      - text: |
          <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
          <!-- As fontes agora são servidas daqui mesmo (ver @font-face no custom.scss).
               O preload adianta os dois arquivos do subconjunto latin, que é o que
               o topo da página usa; o latin-ext só é buscado se algum caractere
               fora dessa faixa aparecer. -->
          <link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-latin.woff2" crossorigin>
          <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin>
      - file: _includes/schema.html
    include-after-body:
      - text: |
          <script>
          // Fade-in on scroll
          document.addEventListener("DOMContentLoaded", () => {
            const io = new IntersectionObserver((entries) => {
              entries.forEach(e => {
                if (e.isIntersecting) {
                  e.target.classList.add("is-visible");
                  io.unobserve(e.target);
                }
              });
            }, { threshold: 0.12 });
            // O .hero-banner fica de fora de propósito: é o conteúdo do topo da
            // página e o elemento que o Google mede como LCP. Começar invisível
            // (opacity: 0) atrasa essa medição, porque o Chrome não considera
            // candidato a LCP um elemento invisível.
            document.querySelectorAll("main h2, main .card, main .info-grid, main .gallery, main .map-wrap, main .pub-list, main figure").forEach(el => {
              el.classList.add("fade-in");
              io.observe(el);
            });
          });
          </script>

lang: pt-BR
